dataset:
  name: sunrgbd
  root: data/sunRGB
  split: all
  label_set: "37"
  ignore_labels: [0]

study:
  name: sunrgbd_representation_smoke
  output_root: outputs
  seed: 42
  max_samples: 10

representations:
  pointcloud:
    enabled: true
    budget: 5000
    seed: 42
  surfel:
    enabled: true
    budget: 5000
    radius_m: 0.02
  mesh:
    enabled: true
    max_depth_jump_m: 0.05
    max_edge_length_m: 0.25
  voxel:
    enabled: true
    voxel_size_m: 0.04
  tsdf:
    enabled: true
    voxel_size_m: 0.06
    truncation_multiplier: 3.0
    ray_stride: 8
  superpoint:
    enabled: true
    target_regions: 1000

views: [original, left_oblique, right_oblique, elevated]
