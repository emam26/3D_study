experiment_name: "v1_rgb_segformer_5ep_sunrgbd"

dataset:
  name: "sunrgbd"
  root: "data/sunRGB"
  split: "all"
  label_set: "37"
  num_classes: 37
  ignore_label: 0
  max_depth_m: 8.0

model:
  name: "nvidia/segformer-b0-finetuned-ade-512-512"
  pretrained: true

training:
  epochs: 5
  batch_size: 4
  num_workers: 4
  image_size: [480, 480]
  learning_rate: 0.00006
  weight_decay: 0.01
  use_amp: true
  seed: 42
  evaluate_each_epoch: true

evaluation:
  batch_size: 4
  val_fraction: 0.2

paths:
  output_root: "outputs/segmentation/v1_rgb_segformer_5ep_sunrgbd"
